{% extends "base.html" %}{% block body %}<h1>Register as a supplier</h1><p class="mut">Add your business and your first price listing.</p>
<form class="f" method="post" enctype="multipart/form-data"><label>Business name<input name="name" required></label><label>City<input name="city" required></label>
<label>Phone<input name="phone" required pattern="[0-9+ ]{10,14}"></label><label>GSTIN<input name="gstin" required minlength="15" maxlength="15"></label>
<h2>First listing</h2><label>Category<select name="category">{% for c in cats %}<option>{{ c }}</option>{% endfor %}</select></label>
<label>Product name<input name="product" placeholder="e.g. PPC cement"></label><label>Price (₹ per unit: bag / tonne / 1000 bricks)<input name="price" type="number" step="0.01" min="1"></label>
<label>Product photo (optional, PNG/JPG/WEBP, max 3 MB)<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Minimum order quantity<input name="min_qty" type="number" min="1" value="1"></label><label>Stock available<input name="stock" type="number" min="0" value="100"></label>
<button>Register supplier</button></form>{% endblock %}
